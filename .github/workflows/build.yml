name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          Z=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$Z" ] && [ ! -f settings.gradle ]; then unzip -o "$Z"; fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NohmanTradingBot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NohmanTradingBot.apk
          path: NohmanTradingBot.apk

      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest NohmanTradingBot.apk --title "Nohman Trading Bot APK" --notes "Download NohmanTradingBot.apk"
